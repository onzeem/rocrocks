spring.application.name=demo
# In-memory H2 database - resets every time the app restarts, which is fine for a hackathon
spring.datasource.url=jdbc:h2:mem:budgetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically creates/updates tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: lets you browse the database in a web UI at localhost:8080/h2-console while the app is running
spring.h2.console.enabled=true

spring.jpa.defer-datasource-initialization=true