<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROC Rocks Budgeting — Savings</title>
<link rel="stylesheet" href="style.css" />
<script src="auth.js" defer></script>
</head>
<body>

<div class="confetti" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="shell">

     <header class="masthead">
    <div class="brand">
      <a href="home.html" class="brand-coin" aria-label="Go to home">$</a>
      <span class="brand-mark">ROC Rocks Budgeting</span>
    </div>
    <div class="masthead-right">
      <nav class="navbar" aria-label="Primary">
          <ul>
              <li class="nav-app-link"><a href="home.html">Home</a></li>
              <li class="nav-app-link"><a href="budget.html">Budget</a></li>
              <li class="nav-app-link"><a href="receipt.html">Receipt Upload</a></li>
              <li class="nav-app-link"><a href="savings.html" class="active">Savings</a></li>
              <li class="nav-app-link"><a href="transactions.html">Transactions</a></li>          
              <li class="nav-about-link"><a href="about.html">About</a></li>          
            </ul>
      </nav>
      <a href="signin.html" id="signin-cta" class="btn-signin">Sign in / Sign up</a>
      <div class="profile-menu" id="profile-menu">
        <a href="signin.html" id="profile-btn" class="profile-btn" aria-label="Open profile page">👤</a>
        <div class="profile-dropdown">
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </div>
      </div>
    </div>
  </header>

  <section class="section" aria-label="Savings goals">
    <div class="section-head">
      <div class="section-head-title">
        <h2>Savings goals</h2>
        <span class="meta" id="goal-count">3 active</span>
      </div>
      <a href="add-goal.html" class="btn-primary">+ Add goal</a>
    </div>

    <section class="stat-row" aria-label="This month's savings allocation" id="allocation-summary" style="margin-bottom: 20px;">
      <div class="stat">
        <p class="label">Total saved</p>
        <p class="figure tabular" id="summary-total-saved">—</p>
      </div>
      <div class="stat">
        <p class="label">Available to save</p>
        <p class="figure tabular" id="summary-cap">—</p>
      </div>
      <div class="stat">
        <p class="label">Unallocated</p>
        <p class="figure tabular" id="summary-remaining">—</p>
      </div>
    </section>

    <div class="goal-card-grid" id="goal-card-grid"></div>
  </section>

  <script src="api.js"></script>
  <script>
    const DEMO_USER_ID = 33;

    const grid = document.getElementById("goal-card-grid");
    const r = 40;
    const circumference = 2 * Math.PI * r;

    async function loadAllocationSummary() {
      try {
        const summary = await apiGet(`/savings-goals/user/${DEMO_USER_ID}/allocation-summary`);
        document.getElementById("summary-cap").textContent = `$${summary.availableToSave.toLocaleString()}`;
        document.getElementById("summary-remaining").textContent = `$${summary.remaining.toLocaleString()}`;
      } catch (err) {
        console.error("Failed to load allocation summary:", err);
      }
    }

    async function loadGoals() {
      try {
        const goals = await apiGet(`/savings-goals/user/${DEMO_USER_ID}`);
        document.getElementById("goal-count").textContent = `${goals.length} active`;

        const totalSaved = goals.reduce((sum, g) => sum + g.savedAmount, 0);
        document.getElementById("summary-total-saved").textContent = `$${totalSaved.toLocaleString()}`;

        grid.innerHTML = goals.map((goal) => {
          const pct = goal.percentFunded; // can exceed 100 once over-funding is allowed
          const ringPct = Math.min(100, pct); // ring visually caps at a full circle regardless
          const offset = (circumference * (1 - ringPct / 100)).toFixed(1);

          const dueDateHtml = goal.dueDate
            ? `<span class="goal-card-due">📅 ${new Date(goal.dueDate + "T00:00:00").toLocaleDateString("en-US", { month: "short", year: "numeric" })}</span>`
            : "";
          const noteHtml = goal.note
            ? `<p class="goal-card-desc">${goal.note}</p>`
            : "";
          const afTag = goal.fullyFunded ? "A" : "F";

          return `
            <article class="goal-card" style="background: var(--${goal.color}-tint);">
              <div class="goal-card-header">
                <span class="cat-dot" style="background: #fff"><span class="cat-icon">${goal.icon}</span></span>
                <h3 class="goal-card-title">${goal.name}</h3>
                <span class="cat-dot" style="background: #fff"><span class="cat-icon">${afTag}</span></span>
              </div>
              <div class="goal-card-body">
                <div class="goal-card-ring-col">
                  <div class="goal-ring-wrap">
                    <svg viewBox="0 0 100 100" role="img" aria-label="${pct} percent funded">
                      <circle class="track" cx="50" cy="50" r="${r}" fill="none" stroke-width="10"/>
                      <circle class="progress" cx="50" cy="50" r="${r}" fill="none" stroke-width="10"
                              stroke="var(--${goal.color})" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset}"/>
                    </svg>
                    <span class="goal-ring-pct">${pct}%</span>
                  </div>
                  ${noteHtml}
                </div>
                <div class="goal-card-info-col">
                  <p class="goal-card-amount tabular">$${goal.savedAmount.toLocaleString()}<span>of $${goal.targetAmount.toLocaleString()}</span></p>
                  ${dueDateHtml}
                  <div class="txn-form" style="margin-top: 10px;">
                    <div class="field" style="flex: 1 1 90px;">
                      <input type="number" id="allocate-amount-${goal.id}" placeholder="0.00" step="0.01" min="0.01" />
                    </div>
                    <button type="button" class="btn-primary" style="margin-top: 0;" data-allocate="${goal.id}">Add funds</button>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join("");

        grid.querySelectorAll("[data-allocate]").forEach((btn) => {
          btn.addEventListener("click", () => allocateFunds(btn.dataset.allocate));
        });
      } catch (err) {
        console.error("Failed to load savings goals:", err);
        grid.innerHTML = `<p>No savings goals found.</p>`;
      }
    }

    async function allocateFunds(goalId) {
      const input = document.getElementById(`allocate-amount-${goalId}`);
      const amount = parseFloat(input.value);
      if (!amount || amount <= 0) return;

      try {
        await apiPost(`/savings-goals/${goalId}/allocate`, { amount });
        loadGoals(); // re-render with the updated saved amount / ring / A-F tag
        loadAllocationSummary(); // reflect the new allocated/remaining totals immediately
      } catch (err) {
        console.error("Failed to allocate funds:", err);
        alert(err.message || "Couldn't add funds — check the console for details.");
      }
    }

    loadGoals();
    loadAllocationSummary();
  </script>

  <footer class="footer">
    <span>Statement generated Sep 19, 2026</span>
    <span>All figures in USD</span>
  </footer>

</div>

</body>
</html>
