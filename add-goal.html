<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROC Rocks Budgeting — Add a Savings Goal</title>
<link rel="stylesheet" href="style.css" />
<script src="auth.js" defer></script>
</head>
<body>

<div class="confetti" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="shell">

    <header class="masthead">
    <div class="brand">
      <a href="home.html" class="brand-coin" aria-label="Go to home">$</a>
      <span class="brand-mark">ROC Rocks Budgeting</span>
      <span class="brand-tag">Personal budget</span>
    </div>
    <div class="masthead-right">
      <nav class="navbar" aria-label="Primary">
          <ul>
              <li class="nav-app-link"><a href="home.html">Home</a></li>
             <li class="nav-app-link"><a href="budget.html">Budget</a></li>
             <li class="nav-app-link"><a href="receipt.html">Receipt Upload</a></li>
             <li class="nav-app-link"><a href="savings.html" class="active">Savings</a></li>
             <li class="nav-app-link"><a href="transactions.html">Transactions</a></li>
             <li class="nav-about-link"><a href="about.html">About</a></li>
         </ul>
      </nav>
      <a href="signin.html" id="signin-cta" class="btn-signin">Sign in / Sign up</a>
      <div class="profile-menu" id="profile-menu">
        <a href="signin.html" id="profile-btn" class="profile-btn" aria-label="Open profile page">👤</a>
        <div class="profile-dropdown">
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </div>
      </div>
    </div>
  </header>

  <div class="form-page-wrap">
    <div class="auth-card" style="max-width: 460px;">
      <p class="auth-eyebrow">New goal</p>
      <h1 class="auth-title">Add a savings goal</h1>
      <p class="auth-subtitle">This gets added to your goals on Home and Savings.</p>

      <form class="auth-form" id="add-goal-form">
        <div class="field">
          <label for="goal-name">Goal name</label>
          <input type="text" id="goal-name" placeholder="e.g. New couch" required />
        </div>
        <div class="field">
          <label for="goal-icon">Icon</label>
          <select id="goal-icon">
            <option value="🛟">🛟 Life ring</option>
            <option value="✈️">✈️ Travel</option>
            <option value="💻">💻 Tech</option>
            <option value="🏠">🏠 Home</option>
            <option value="🚗">🚗 Car</option>
            <option value="🎓">🎓 Education</option>
            <option value="🎁">🎁 Gift</option>
            <option value="💍">💍 Wedding</option>
          </select>
        </div>
        <div class="field">
          <label for="goal-color">Color</label>
          <select id="goal-color">
            <option value="grape">Grape</option>
            <option value="coral">Coral</option>
            <option value="mint">Mint</option>
            <option value="yellow">Yellow</option>
            <option value="pink">Pink</option>
            <option value="sky">Sky</option>
          </select>
        </div>
        <div class="field">
          <label for="goal-saved">Already saved</label>
          <input type="number" id="goal-saved" placeholder="0.00" step="0.01" min="0" required />
        </div>
        <div class="field">
          <label for="goal-target">Goal amount</label>
          <input type="number" id="goal-target" placeholder="0.00" step="0.01" min="0.01" required />
        </div>
        <div class="field">
          <label for="goal-due">Due date <span style="font-weight: 400; color: var(--ink-soft);">(optional)</span></label>
          <input type="date" id="goal-due" />
        </div>
        <div class="field">
          <label for="goal-note">Note <span style="font-weight: 400; color: var(--ink-soft);">(optional)</span></label>
          <input type="text" id="goal-note" placeholder="e.g. Add $100/mo to make the date" />
        </div>
        <button type="submit" class="btn-primary">Add goal</button>
      </form>

      <p class="auth-switch"><a href="savings.html">Cancel and go back</a></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const DEMO_USER_ID = 33;

    document.getElementById("add-goal-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("goal-name").value.trim();
      const icon = document.getElementById("goal-icon").value;
      const color = document.getElementById("goal-color").value;
      const savedAmount = parseFloat(document.getElementById("goal-saved").value);
      const targetAmount = parseFloat(document.getElementById("goal-target").value);
      const dueValue = document.getElementById("goal-due").value; // "YYYY-MM-DD" or ""
      const note = document.getElementById("goal-note").value.trim();

      if (!name || isNaN(savedAmount) || savedAmount < 0 || !targetAmount || targetAmount <= 0) return;

      try {
        await apiPost("/savings-goals", {
          userId: DEMO_USER_ID,
          name,
          icon,
          color,
          savedAmount,
          targetAmount,
          dueDate: dueValue || null,
          note: note || null,
        });
        window.location.href = "savings.html";
      } catch (err) {
        console.error("Failed to add savings goal:", err);
        alert(err.message || "Couldn't add that goal — check the console for details.");
      }
    });
  </script>

</div>

</body>
</html>
